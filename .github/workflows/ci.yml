name: CI

on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ainolez_test
          MARIADB_USER: ainolez_app
          MARIADB_PASSWORD: ci_password
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect" --health-interval=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-secret
      DB_NAME: ainolez_test
      DB_USER: ainolez_app
      DB_PASSWORD: ci_password
      DB_HOST: 127.0.0.1
      FRONTEND_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
